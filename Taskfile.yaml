version: "3"

# Loads .env for every command, so goose, sqlc and the app all see your settings.
# Task also runs every command from the folder this file is in (the project root),
# so the "wrong working directory" problem disappears.
dotenv: [".env"]

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  run:
    desc: Run the API
    cmds:
      - go run ./cmd/api

  dev:
    desc: Start Postgres, apply migrations, then run the API
    cmds:
      - task: db:up
      - task: migrate:up
      - task: run

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o bin/dakeh ./cmd/api

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  sqlc:
    desc: Regenerate DB code from SQL
    cmds:
      - sqlc generate

  db:up:
    desc: Start Postgres (and Redis later) in Docker
    cmds:
      - docker compose up -d

  db:down:
    desc: Stop containers (data is kept)
    cmds:
      - docker compose down

  db:reset:
    desc: Stop containers AND delete the database volume
    cmds:
      - docker compose down -v

  migrate:up:
    desc: Apply all migrations
    cmds:
      - goose -dir db/migrations up

  migrate:down:
    desc: Roll back the last migration
    cmds:
      - goose -dir db/migrations down

  migrate:status:
    desc: Show migration status
    cmds:
      - goose -dir db/migrations status

  migrate:create:
    desc: "Create a numbered migration, e.g. task migrate:create -- create_products"
    cmds:
      - goose -dir db/migrations -s create {{.CLI_ARGS}} sql