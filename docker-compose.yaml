services:
  postgres:
    image: postgres:16
    container_name: dakeh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mohsen1212
      POSTGRES_PASSWORD: m021021021M
      POSTGRES_DB: dakeh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mohsen1212 -d dakeh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: